name: Build Aviary App
run-name: Aviary build ${{ inputs.build_run_id }}

# GitHub also delivers a push event when this file changes. Without a push
# trigger that event becomes a failed run with zero jobs. The prepare guard
# skips that push, so no product build starts.
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Hawk platform workflow run id
        required: true
        type: string
      build_run_ids:
        description: Comma-separated Hawk platform workflow run ids in this chunk
        required: false
        type: string
        default: ''
      dispatch_proof:
        description: One-time Hawk dispatch correlation proof
        required: true
        type: string
  push:
    branches:
      - main
    paths:
      - .github/workflows/build.yml

permissions:
  contents: read

jobs:
  chunk:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      requested_matrix: ${{ steps.requested.outputs.requested_matrix }}
    steps:
      - name: Checkout buildbox
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: boxliy/buildbox
          ref: 723f2f013474e0cba663a3728304d77dfd764e55
          persist-credentials: false

      - name: Resolve requested chunk runs
        id: requested
        env:
          BUILDBOX_RUN_ID: ${{ inputs.build_run_id }}
          BUILD_RUN_IDS: ${{ inputs.build_run_ids }}
        run: scripts/requested-runs

  prepare:
    needs: [chunk]
    if: ${{ github.event_name == 'workflow_dispatch' && needs.chunk.result == 'success' }}
    permissions:
      contents: read
      id-token: write
    uses: boxliy/buildbox/.github/workflows/prepare.yml@723f2f013474e0cba663a3728304d77dfd764e55
    with:
      build_run_id: ${{ inputs.build_run_id }}
      build_run_ids: ${{ inputs.build_run_ids }}
      tools_sha: 723f2f013474e0cba663a3728304d77dfd764e55
    secrets:
      HAWK_BASE_URL: ${{ secrets.HAWK_BASE_URL }}
      HAWK_OIDC_AUDIENCE: ${{ secrets.HAWK_OIDC_AUDIENCE }}
      AVIARY_SOURCE_APP_PRIVATE_KEY: ${{ secrets.AVIARY_SOURCE_APP_PRIVATE_KEY }}
      BUILDBOX_SOURCE_TOKEN: ${{ secrets.BUILDBOX_SOURCE_TOKEN }}

  compile:
    needs: prepare
    if: ${{ needs.prepare.result == 'success' && needs.prepare.outputs.has_android == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        item: ${{ fromJson(needs.prepare.outputs.android_matrix || '[]') }}
    env:
      BUILDBOX_RUN_ID: ${{ matrix.item.build_run_id }}
      BUILDBOX_GITHUB_RUN_ID: ${{ github.run_id }}
    permissions:
      contents: read
    steps:
      - name: Initialize isolated compile state
        run: echo "BUILDBOX_STATE_DIR=$RUNNER_TEMP/buildbox/${{ matrix.item.build_run_id }}" >>"$GITHUB_ENV"
      - name: Checkout buildbox
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: boxliy/buildbox
          ref: 723f2f013474e0cba663a3728304d77dfd764e55
          persist-credentials: false

      - name: Restore compile inputs
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: compile-input-${{ github.run_id }}
          path: ${{ runner.temp }}/buildbox

      - name: Restore frozen source without a repository credential
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: source-${{ github.run_id }}
          path: ${{ runner.temp }}/source-input

      - name: Restore source permissions
        run: tar -xf "$RUNNER_TEMP/source-input/source.tar" -C "$GITHUB_WORKSPACE"

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: ${{ matrix.item.flutter_version }}
          cache: true

      - name: Cache Android build dependencies
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-${{ runner.os }}-${{ matrix.item.flutter_version }}-${{ hashFiles('aviary-source/waterfowl/pubspec.lock') }}

      - name: Resolve trusted Buildbox tools
        run: dart pub get --enforce-lockfile

      - name: Compile unsigned artifacts
        run: scripts/build-android

      - name: Preserve unsigned outputs
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: unsigned-output-${{ github.run_id }}-${{ matrix.item.build_run_id }}
          path: |
            ${{ runner.temp }}/buildbox/${{ matrix.item.build_run_id }}/unsigned
            ${{ runner.temp }}/buildbox/${{ matrix.item.build_run_id }}/unsigned-manifest.json
          retention-days: 1
          if-no-files-found: error

  compile-ios:
    needs: prepare
    if: ${{ needs.prepare.result == 'success' && needs.prepare.outputs.has_ios == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        item: ${{ fromJson(needs.prepare.outputs.ios_matrix || '[]') }}
    env:
      BUILDBOX_RUN_ID: ${{ matrix.item.build_run_id }}
      BUILDBOX_GITHUB_RUN_ID: ${{ github.run_id }}
    permissions:
      contents: read
    steps:
      - name: Initialize isolated compile state
        run: echo "BUILDBOX_STATE_DIR=$RUNNER_TEMP/buildbox/${{ matrix.item.build_run_id }}" >>"$GITHUB_ENV"
      - name: Checkout buildbox
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: boxliy/buildbox
          ref: 723f2f013474e0cba663a3728304d77dfd764e55
          persist-credentials: false

      - name: Restore compile inputs
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: compile-input-${{ github.run_id }}
          path: ${{ runner.temp }}/buildbox

      - name: Restore frozen source without a repository credential
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: source-${{ github.run_id }}
          path: ${{ runner.temp }}/source-input

      - name: Restore source permissions
        run: tar -xf "$RUNNER_TEMP/source-input/source.tar" -C "$GITHUB_WORKSPACE"

      - name: Setup Flutter
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: ${{ matrix.item.flutter_version }}
          cache: true

      - name: Cache iOS build dependencies
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.pub-cache
            ~/Library/Caches/CocoaPods
          key: ios-${{ runner.os }}-${{ matrix.item.flutter_version }}-${{ hashFiles('aviary-source/waterfowl/pubspec.lock') }}

      - name: Resolve trusted Buildbox tools
        run: dart pub get --enforce-lockfile

      - name: Compile unsigned artifacts
        run: scripts/build-ios

      - name: Preserve unsigned outputs
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: unsigned-output-${{ github.run_id }}-${{ matrix.item.build_run_id }}
          path: |
            ${{ runner.temp }}/buildbox/${{ matrix.item.build_run_id }}/unsigned
            ${{ runner.temp }}/buildbox/${{ matrix.item.build_run_id }}/unsigned-manifest.json
          retention-days: 1
          if-no-files-found: error

  sign:
    needs: [prepare, compile]
    if: ${{ always() && needs.prepare.result == 'success' && needs.prepare.outputs.has_android == 'true' && (needs.compile.result == 'success' || needs.compile.result == 'failure') }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        item: ${{ fromJson(needs.prepare.outputs.android_matrix || '[]') }}
    uses: boxliy/buildbox/.github/workflows/sign.yml@723f2f013474e0cba663a3728304d77dfd764e55
    with:
      build_run_id: ${{ matrix.item.build_run_id }}
      platform: android
      tools_sha: 723f2f013474e0cba663a3728304d77dfd764e55
    secrets:
      HAWK_BASE_URL: ${{ secrets.HAWK_BASE_URL }}
      HAWK_OIDC_AUDIENCE: ${{ secrets.HAWK_OIDC_AUDIENCE }}

  sign-ios:
    needs: [prepare, compile-ios]
    if: ${{ always() && needs.prepare.result == 'success' && needs.prepare.outputs.has_ios == 'true' && (needs.compile-ios.result == 'success' || needs.compile-ios.result == 'failure') }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        item: ${{ fromJson(needs.prepare.outputs.ios_matrix || '[]') }}
    uses: boxliy/buildbox/.github/workflows/sign.yml@723f2f013474e0cba663a3728304d77dfd764e55
    with:
      build_run_id: ${{ matrix.item.build_run_id }}
      platform: ios
      tools_sha: 723f2f013474e0cba663a3728304d77dfd764e55
    secrets:
      HAWK_BASE_URL: ${{ secrets.HAWK_BASE_URL }}
      HAWK_OIDC_AUDIENCE: ${{ secrets.HAWK_OIDC_AUDIENCE }}

  finalize:
    if: ${{ always() && github.event_name == 'workflow_dispatch' && needs.prepare.result == 'success' && needs.prepare.outputs.has_android == 'true' }}
    needs: [prepare, compile, sign]
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        item: ${{ fromJson(needs.prepare.outputs.android_matrix || '[]') }}
    uses: boxliy/buildbox/.github/workflows/finalize.yml@723f2f013474e0cba663a3728304d77dfd764e55
    with:
      build_run_id: ${{ matrix.item.build_run_id }}
      tools_sha: 723f2f013474e0cba663a3728304d77dfd764e55
      prepare_result: ${{ needs.prepare.result }}
      compile_result: ${{ needs.compile.result == 'cancelled' && 'cancelled' || 'success' }}
      sign_result: ${{ needs.sign.result == 'cancelled' && 'cancelled' || 'success' }}
    secrets:
      HAWK_BASE_URL: ${{ secrets.HAWK_BASE_URL }}
      HAWK_OIDC_AUDIENCE: ${{ secrets.HAWK_OIDC_AUDIENCE }}

  finalize-failed:
    if: ${{ always() && github.event_name == 'workflow_dispatch' && needs.prepare.result == 'success' && needs.prepare.outputs.has_failed == 'true' }}
    needs: [prepare]
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        item: ${{ fromJson(needs.prepare.outputs.failed_matrix || '[]') }}
    uses: boxliy/buildbox/.github/workflows/finalize.yml@723f2f013474e0cba663a3728304d77dfd764e55
    with:
      build_run_id: ${{ matrix.item.build_run_id }}
      tools_sha: 723f2f013474e0cba663a3728304d77dfd764e55
      prepare_result: failure
      compile_result: skipped
      sign_result: skipped
      failure_reason: prepare failed before compile
    secrets:
      HAWK_BASE_URL: ${{ secrets.HAWK_BASE_URL }}
      HAWK_OIDC_AUDIENCE: ${{ secrets.HAWK_OIDC_AUDIENCE }}

  finalize-ios:
    if: ${{ always() && github.event_name == 'workflow_dispatch' && needs.prepare.result == 'success' && needs.prepare.outputs.has_ios == 'true' }}
    needs: [prepare, compile-ios, sign-ios]
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        item: ${{ fromJson(needs.prepare.outputs.ios_matrix || '[]') }}
    uses: boxliy/buildbox/.github/workflows/finalize.yml@723f2f013474e0cba663a3728304d77dfd764e55
    with:
      build_run_id: ${{ matrix.item.build_run_id }}
      tools_sha: 723f2f013474e0cba663a3728304d77dfd764e55
      prepare_result: ${{ needs.prepare.result }}
      compile_result: ${{ needs.compile-ios.result == 'cancelled' && 'cancelled' || 'success' }}
      sign_result: ${{ needs.sign-ios.result == 'cancelled' && 'cancelled' || 'success' }}
    secrets:
      HAWK_BASE_URL: ${{ secrets.HAWK_BASE_URL }}
      HAWK_OIDC_AUDIENCE: ${{ secrets.HAWK_OIDC_AUDIENCE }}

  finalize-prepare:
    if: ${{ always() && github.event_name == 'workflow_dispatch' && needs.prepare.result != 'skipped' && needs.prepare.result != 'success' }}
    needs: [prepare, chunk]
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        item: ${{ fromJson(needs.chunk.outputs.requested_matrix || '[]') }}
    uses: boxliy/buildbox/.github/workflows/finalize.yml@723f2f013474e0cba663a3728304d77dfd764e55
    with:
      build_run_id: ${{ matrix.item.build_run_id }}
      tools_sha: 723f2f013474e0cba663a3728304d77dfd764e55
      prepare_result: ${{ needs.prepare.result }}
      compile_result: skipped
      sign_result: skipped
      failure_reason: ${{ needs.prepare.outputs.failure_reason }}
    secrets:
      HAWK_BASE_URL: ${{ secrets.HAWK_BASE_URL }}
      HAWK_OIDC_AUDIENCE: ${{ secrets.HAWK_OIDC_AUDIENCE }}
