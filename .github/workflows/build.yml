name: Build Aviary App
run-name: Aviary build ${{ inputs.build_run_id }}

# GitHub also delivers a push event when this file changes. Without a push
# trigger that event becomes a failed run with zero jobs. The prepare guard
# skips that push, so no product build starts.
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Hawk platform workflow run id
        required: true
        type: string
      dispatch_proof:
        description: One-time Hawk dispatch correlation proof
        required: true
        type: string
  push:
    branches:
      - main
    paths:
      - .github/workflows/build.yml

permissions:
  contents: read

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' && github.event.repository.private == true
    permissions:
      contents: read
      id-token: write
    uses: boxliy/buildbox/.github/workflows/prepare.yml@90c601b85a68602d7fae69aee0ea8f09d08a5124
    with:
      build_run_id: ${{ inputs.build_run_id }}
    secrets:
      HAWK_BASE_URL: ${{ secrets.HAWK_BASE_URL }}
      HAWK_OIDC_AUDIENCE: ${{ secrets.HAWK_OIDC_AUDIENCE }}
      AVIARY_SOURCE_APP_PRIVATE_KEY: ${{ secrets.AVIARY_SOURCE_APP_PRIVATE_KEY }}

  compile:
    needs: prepare
    runs-on: ${{ needs.prepare.outputs.platform == 'ios' && 'macos-15' || 'ubuntu-24.04' }}
    timeout-minutes: 120
    env:
      BUILDBOX_GITHUB_RUN_ID: ${{ github.run_id }}
    permissions:
      contents: read
    steps:
      - name: Initialize isolated compile state
        run: echo "BUILDBOX_STATE_DIR=$RUNNER_TEMP/buildbox" >>"$GITHUB_ENV"
      - name: Checkout buildbox
        uses: actions/checkout@11bd71901bbe5b1635a9e225c5f9a0cfbc0a8a3c # v4.2.2
        with:
          repository: boxliy/buildbox
          ref: 1e70f087541e61df2df3064c4f4d05ddbaf4326f
          persist-credentials: false

      - name: Restore compile inputs
        uses: actions/download-artifact@fa0a81b094735e8772adab4bb149259f5d49d87b # v4.1.8
        with:
          name: compile-input-${{ github.run_id }}
          path: ${{ runner.temp }}/buildbox

      - name: Restore frozen source without a repository credential
        uses: actions/download-artifact@fa0a81b094735e8772adab4bb149259f5d49d87b
        with:
          name: source-${{ github.run_id }}
          path: ${{ runner.temp }}/source-input

      - name: Restore source permissions
        run: tar -xf "$RUNNER_TEMP/source-input/source.tar" -C "$GITHUB_WORKSPACE"

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: ${{ needs.prepare.outputs.flutter_version }}
          cache: false

      - name: Compile unsigned artifacts
        env:
          PLATFORM: ${{ needs.prepare.outputs.platform }}
        run: |
          case "$PLATFORM" in
            android) scripts/build-android ;;
            ios) scripts/build-ios ;;
            *) exit 1 ;;
          esac

      - name: Preserve unsigned outputs
        uses: actions/upload-artifact@50769540e7f4bd7f9d42d1b79bccb20935c6c3aa # v4.6.0
        with:
          name: unsigned-output-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/buildbox/unsigned
            ${{ runner.temp }}/buildbox/unsigned-manifest.json
          retention-days: 1
          if-no-files-found: error

  sign:
    needs: [prepare, compile]
    permissions:
      contents: read
      id-token: write
    uses: boxliy/buildbox/.github/workflows/sign.yml@90c601b85a68602d7fae69aee0ea8f09d08a5124
    with:
      build_run_id: ${{ inputs.build_run_id }}
      platform: ${{ needs.prepare.outputs.platform }}
    secrets:
      HAWK_BASE_URL: ${{ secrets.HAWK_BASE_URL }}
      HAWK_OIDC_AUDIENCE: ${{ secrets.HAWK_OIDC_AUDIENCE }}

  finalize:
    if: ${{ always() && github.event_name == 'workflow_dispatch' && needs.prepare.result != 'skipped' }}
    needs: [prepare, compile, sign]
    permissions:
      contents: read
      id-token: write
    uses: boxliy/buildbox/.github/workflows/finalize.yml@90c601b85a68602d7fae69aee0ea8f09d08a5124
    with:
      build_run_id: ${{ inputs.build_run_id }}
      prepare_result: ${{ needs.prepare.result }}
      compile_result: ${{ needs.compile.result }}
      sign_result: ${{ needs.sign.result }}
      failure_reason: ${{ needs.prepare.outputs.failure_reason }}
    secrets:
      HAWK_BASE_URL: ${{ secrets.HAWK_BASE_URL }}
      HAWK_OIDC_AUDIENCE: ${{ secrets.HAWK_OIDC_AUDIENCE }}
