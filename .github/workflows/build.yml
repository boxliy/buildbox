name: Build Android

on:
  workflow_dispatch:
    inputs:
      build_spec_id:
        description: Hawk build spec id
        required: true
        type: string

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      HAWK_BASE_URL: ${{ secrets.HAWK_BASE_URL }}
      HAWK_BUILDBOX_TOKEN: ${{ secrets.HAWK_BUILDBOX_TOKEN }}
      BUILDBOX_STATE_DIR: ${{ runner.temp }}/buildbox
      BUILDBOX_SPEC_ID: ${{ inputs.build_spec_id }}
      BUILDBOX_GITHUB_RUN_ID: ${{ github.run_id }}

    steps:
      - name: Checkout buildbox
        uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y jq curl

      - name: Load build spec
        id: spec
        run: scripts/load-build-spec "$BUILDBOX_SPEC_ID"

      - name: Checkout Aviary source
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.spec.outputs.checkout_repository }}
          ref: ${{ steps.spec.outputs.commit_sha }}
          path: aviary-source
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: aviary-source/waterfowl/.fvmrc
          cache: true

      - name: Build, upload, and report
        shell: bash
        run: |
          scripts/report-result running
          scripts/build-android
          scripts/upload-oss
          scripts/report-result succeeded

      - name: Report workflow failure
        if: ${{ failure() && steps.spec.outcome == 'success' }}
        shell: bash
        run: scripts/report-result failed "Buildbox workflow failed in GitHub run $BUILDBOX_GITHUB_RUN_ID"
