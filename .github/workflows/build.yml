name: Build Android

# GitHub also delivers a push event when this file changes. Without a push
# trigger that event becomes a failed run with zero jobs. The prepare guard
# skips that push, so no product build starts.
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Hawk platform workflow run id
        required: true
        type: string
  push:
    branches:
      - main
    paths:
      - .github/workflows/build.yml

permissions:
  contents: read

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    outputs:
      checkout_repository: ${{ steps.spec.outputs.checkout_repository }}
      commit_sha: ${{ steps.spec.outputs.commit_sha }}
    env:
      BUILDBOX_STATE_DIR: ${{ runner.temp }}/buildbox
      BUILDBOX_RUN_ID: ${{ inputs.build_run_id }}
      BUILDBOX_GITHUB_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Checkout buildbox
        uses: actions/checkout@11bd71901bbe5b1635a9e225c5f9a0cfbc0a8a3c # v4.2.2

      - name: Exchange prepare credential
        env:
          HAWK_BASE_URL: ${{ secrets.HAWK_BASE_URL }}
          HAWK_OIDC_AUDIENCE: ${{ secrets.HAWK_OIDC_AUDIENCE }}
        run: scripts/exchange-stage prepare

      - name: Load build spec
        id: spec
        env:
          HAWK_BASE_URL: ${{ secrets.HAWK_BASE_URL }}
        run: scripts/load-build-spec "$BUILDBOX_RUN_ID"

      - name: Refuse public artifact transport
        shell: bash
        run: |
          if [[ "${{ github.event.repository.private }}" != "true" ]]; then
            mkdir -p "$BUILDBOX_STATE_DIR"
            printf '%s\n' 'public repository cannot carry unsigned build artifacts' >"$BUILDBOX_STATE_DIR/prepare-failure.txt"
            printf 'public repository cannot carry unsigned build artifacts\n' >&2
            exit 1
          fi

      - name: Export compile inputs
        run: scripts/export-job-inputs compile ${{ runner.temp }}/compile-input

      - name: Preserve compile inputs
        uses: actions/upload-artifact@50769540e7f4bd7f9d42d1b79bccb20935c6c3aa # v4.6.0
        with:
          name: compile-input-${{ github.run_id }}
          path: ${{ runner.temp }}/compile-input
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

      - name: Export sign inputs
        run: scripts/export-job-inputs sign ${{ runner.temp }}/sign-input

      - name: Preserve sign inputs
        uses: actions/upload-artifact@50769540e7f4bd7f9d42d1b79bccb20935c6c3aa # v4.6.0
        with:
          name: sign-input-${{ github.run_id }}
          path: ${{ runner.temp }}/sign-input
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

      - name: Report running
        if: success()
        env:
          HAWK_BASE_URL: ${{ secrets.HAWK_BASE_URL }}
        run: scripts/report-result running

      - name: Report prepare failure
        if: failure()
        shell: bash
        env:
          HAWK_BASE_URL: ${{ secrets.HAWK_BASE_URL }}
        run: |
          reason='Buildbox prepare failed'
          if [[ -f "$BUILDBOX_STATE_DIR/prepare-failure.txt" ]]; then
            reason=$(head -n 1 "$BUILDBOX_STATE_DIR/prepare-failure.txt")
          fi
          scripts/report-result failed "$reason"

  compile:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BUILDBOX_STATE_DIR: ${{ runner.temp }}/buildbox
      BUILDBOX_GITHUB_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Checkout buildbox
        uses: actions/checkout@11bd71901bbe5b1635a9e225c5f9a0cfbc0a8a3c # v4.2.2

      - name: Restore compile inputs
        uses: actions/download-artifact@fa0a81b094735e8772adab4bb149259f5d49d87b # v4.1.8
        with:
          name: compile-input-${{ github.run_id }}
          path: ${{ runner.temp }}/buildbox

      - name: Checkout Aviary source
        uses: actions/checkout@11bd71901bbe5b1635a9e225c5f9a0cfbc0a8a3c # v4.2.2
        with:
          repository: ${{ needs.prepare.outputs.checkout_repository }}
          ref: ${{ needs.prepare.outputs.commit_sha }}
          path: aviary-source
          token: ${{ secrets.AVIARY_SOURCE_TOKEN }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify trusted source revision
        shell: bash
        run: |
          git -C aviary-source rev-parse --verify refs/remotes/origin/main
          git -C aviary-source merge-base --is-ancestor HEAD refs/remotes/origin/main

      - name: Setup Java
        uses: actions/setup-java@3b6d5d7d79b1cf4f1e2d8bbf221eb9e2c0fe6c20 # v4.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@0c358ac8cd05a0bda2e8c9d6cd6d6b87f736a8b9 # v2.16.0
        with:
          flutter-version-file: aviary-source/waterfowl/.fvmrc
          cache: true

      - name: Compile unsigned Android artifacts
        shell: bash
        run: scripts/build-android

      - name: Preserve unsigned outputs
        uses: actions/upload-artifact@50769540e7f4bd7f9d42d1b79bccb20935c6c3aa # v4.6.0
        with:
          name: unsigned-output-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/buildbox/unsigned
            ${{ runner.temp }}/buildbox/unsigned-manifest.json
          retention-days: 1

  sign:
    needs: [prepare, compile]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BUILDBOX_STATE_DIR: ${{ runner.temp }}/buildbox
      BUILDBOX_GITHUB_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Checkout buildbox
        uses: actions/checkout@11bd71901bbe5b1635a9e225c5f9a0cfbc0a8a3c # v4.2.2

      - name: Restore sign inputs
        uses: actions/download-artifact@fa0a81b094735e8772adab4bb149259f5d49d87b # v4.1.8
        with:
          name: sign-input-${{ github.run_id }}
          path: ${{ runner.temp }}/buildbox

      - name: Restore unsigned outputs
        if: ${{ needs.compile.result == 'success' }}
        uses: actions/download-artifact@fa0a81b094735e8772adab4bb149259f5d49d87b # v4.1.8
        with:
          name: unsigned-output-${{ github.run_id }}
          path: ${{ runner.temp }}/buildbox

      - name: Sign Android artifacts
        if: ${{ needs.compile.result == 'success' }}
        shell: bash
        run: scripts/sign-android

      - name: Preserve signed outputs
        if: ${{ needs.compile.result == 'success' }}
        uses: actions/upload-artifact@50769540e7f4bd7f9d42d1b79bccb20935c6c3aa # v4.6.0
        with:
          name: signed-output-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/buildbox/artifacts
            ${{ runner.temp }}/buildbox/sign-proof.json
          retention-days: 1

  finalize:
    if: ${{ always() && needs.prepare.result == 'success' }}
    needs: [prepare, compile, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      BUILDBOX_STATE_DIR: ${{ runner.temp }}/buildbox
      BUILDBOX_RUN_ID: ${{ inputs.build_run_id }}
      BUILDBOX_GITHUB_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Checkout buildbox
        uses: actions/checkout@11bd71901bbe5b1635a9e225c5f9a0cfbc0a8a3c # v4.2.2

      - name: Restore sign inputs
        uses: actions/download-artifact@fa0a81b094735e8772adab4bb149259f5d49d87b # v4.1.8
        with:
          name: sign-input-${{ github.run_id }}
          path: ${{ runner.temp }}/buildbox

      - name: Restore signed outputs
        if: ${{ needs.sign.result == 'success' }}
        uses: actions/download-artifact@fa0a81b094735e8772adab4bb149259f5d49d87b # v4.1.8
        with:
          name: signed-output-${{ github.run_id }}
          path: ${{ runner.temp }}/buildbox

      - name: Exchange finalize credential
        env:
          HAWK_BASE_URL: ${{ secrets.HAWK_BASE_URL }}
          HAWK_OIDC_AUDIENCE: ${{ secrets.HAWK_OIDC_AUDIENCE }}
        run: scripts/exchange-stage finalize

      - name: Request upload authorization
        if: ${{ needs.sign.result == 'success' }}
        env:
          HAWK_BASE_URL: ${{ secrets.HAWK_BASE_URL }}
        run: scripts/request-upload

      - name: Upload signed artifacts
        if: ${{ needs.sign.result == 'success' }}
        run: scripts/upload-oss

      - name: Report success
        if: ${{ needs.sign.result == 'success' }}
        env:
          HAWK_BASE_URL: ${{ secrets.HAWK_BASE_URL }}
        run: scripts/report-result succeeded

      - name: Report workflow failure
        if: ${{ needs.sign.result != 'success' || failure() }}
        shell: bash
        env:
          HAWK_BASE_URL: ${{ secrets.HAWK_BASE_URL }}
        run: scripts/report-result failed "Buildbox workflow failed in GitHub run $BUILDBOX_GITHUB_RUN_ID"
