name: Validate signing material

# Material validation only. This workflow does not compile or sign an app.
# The private caller supplies validation_id, dispatch_proof, hawk_base_url,
# and the full commit SHA that contains scripts/signing_validation. The job
# exchanges one validation token, reads one authorized envelope, and posts the
# public result. A compile or sign token is not accepted.
on:
  workflow_call:
    inputs:
      validation_id:
        required: true
        type: string
      hawk_base_url:
        required: true
        type: string
      validator_sha:
        required: true
        type: string
    secrets:
      HAWK_OIDC_AUDIENCE:
        required: true

permissions:
  contents: read

jobs:
  validate:
    if: >-
      github.repository_owner == 'boxliy' &&
      github.event_name != 'pull_request'
    runs-on: macos-15
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      VALIDATION_ID: ${{ inputs.validation_id }}
      HAWK_BASE_URL: ${{ inputs.hawk_base_url }}
      VALIDATOR_SHA: ${{ inputs.validator_sha }}
    steps:
      - name: Reject unscoped validation
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VALIDATION_ID" =~ ^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$ ]]
          [[ "$VALIDATOR_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HAWK_BASE_URL" == https://* ]]
          [[ "${{ github.event_name }}" != "pull_request" ]]

      - name: Checkout pinned validator
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: boxliy/buildbox
          ref: ${{ inputs.validator_sha }}
          persist-credentials: false

      - name: Setup trusted Dart toolchain
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: '3.47.4'
          cache: false

      - name: Resolve trusted Buildbox tools
        run: dart pub get --enforce-lockfile

      - name: Require the signing validator in this checkout
        shell: bash
        run: |
          set -euo pipefail
          test -f lib/src/material_validation.dart
          test -f scripts/signing_validation/exchange-validation
          test -f scripts/signing_validation/validate-material

      - name: Setup Android keytool
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Exchange validation credential and run validator
        env:
          HAWK_OIDC_AUDIENCE: ${{ secrets.HAWK_OIDC_AUDIENCE }}
        shell: bash
        run: |
          set -euo pipefail
          scripts/signing_validation/exchange-validation
          scripts/signing_validation/validate-material
