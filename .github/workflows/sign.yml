name: Trusted isolated signing
on:
  workflow_call:
    inputs:
      build_run_id:
        required: true
        type: string
      tools_sha:
        description: Delivered Buildbox tools revision
        required: true
        type: string
      platform:
        required: true
        type: string
    secrets:
      HAWK_BASE_URL:
        required: true
      HAWK_OIDC_AUDIENCE:
        required: true
permissions:
  contents: read
  id-token: write
jobs:
  sign:
    runs-on: ${{ inputs.platform == 'ios' && 'macos-latest' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      BUILDBOX_RUN_ID: ${{ inputs.build_run_id }}
      HAWK_BASE_URL: ${{ secrets.HAWK_BASE_URL }}
      BUILDBOX_GITHUB_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Initialize isolated state directory
        run: echo "BUILDBOX_STATE_DIR=$RUNNER_TEMP/buildbox/$BUILDBOX_RUN_ID" >>"$GITHUB_ENV"
      - name: Checkout buildbox
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: boxliy/buildbox
          ref: ${{ inputs.tools_sha }}
          persist-credentials: false

      - name: Setup trusted Dart toolchain
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: '3.47.4'
          cache: false

      - name: Resolve trusted Buildbox tools
        run: dart pub get --enforce-lockfile

      - name: Setup signing Java
        if: inputs.platform == 'android'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare fixed Android signing tools
        if: inputs.platform == 'android'
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;35.0.0' >/dev/null
          echo "$ANDROID_HOME/build-tools/35.0.0" >>"$GITHUB_PATH"
          curl --retry 5 --retry-all-errors --fail --silent --show-error --location --output "$RUNNER_TEMP/bundletool.jar" https://github.com/google/bundletool/releases/download/1.18.2/bundletool-all-1.18.2.jar
          echo 'BUILDBOX_BUNDLETOOL_JAR='"$RUNNER_TEMP/bundletool.jar" >>"$GITHUB_ENV"
          echo 'BUILDBOX_BUNDLETOOL_SHA256=378b5434cd1378bef6b2bc527b8c7f0ff2584b273830335bce54d6d0813c8584' >>"$GITHUB_ENV"

      - name: Restore sign inputs
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: sign-input-${{ github.run_id }}
          path: ${{ runner.temp }}/buildbox

      - name: Restore unsigned outputs
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: unsigned-output-${{ github.run_id }}-${{ inputs.build_run_id }}
          path: ${{ runner.temp }}/buildbox/${{ inputs.build_run_id }}

      - name: Exchange sign credential
        env:
          HAWK_OIDC_AUDIENCE: ${{ secrets.HAWK_OIDC_AUDIENCE }}
        run: scripts/exchange-stage sign

      - name: Sign fixed artifacts
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          case "$PLATFORM" in
            android) scripts/sign-android ;;
            ios) scripts/dart-tool sign-ios ;;
            *) exit 1 ;;
          esac

      - name: Preserve signed outputs
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: signed-output-${{ github.run_id }}-${{ inputs.build_run_id }}
          path: |
            ${{ runner.temp }}/buildbox/${{ inputs.build_run_id }}/artifacts
            ${{ runner.temp }}/buildbox/${{ inputs.build_run_id }}/sign-proof.json
            ${{ runner.temp }}/buildbox/${{ inputs.build_run_id }}/artifacts.json
          retention-days: 1

